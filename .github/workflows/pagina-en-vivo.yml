name: Pagina en vivo

on:
  schedule:
    - cron: '2-59/5 * * * *'     # every 5 minutes (UTC clock; the script only reads the meters when a new 15-min reading is due)
  workflow_dispatch:              # "Run workflow" button, and the hook for an outside timer

permissions:
  contents: write

concurrency:
  group: pagina-en-vivo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit, not the one current when the run was queued

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the DLMS library
        run: pip install --quiet gurux-dlms==1.0.203

      - name: Read meters and build page
        env:
          METER_SETTINGS: ${{ secrets.METER_SETTINGS }}
          METER_IPS: ${{ secrets.METER_IPS }}
          TZ: America/Argentina/Buenos_Aires
        run: python cloud/run_cloud.py

      - name: Camera photo
        continue-on-error: true
        timeout-minutes: 3
        env:
          CAM_FTP_HOST: ${{ secrets.CAM_FTP_HOST }}
          CAM_FTP_USER: ${{ secrets.CAM_FTP_USER }}
          CAM_FTP_PASS: ${{ secrets.CAM_FTP_PASS }}
          CAM_KEY: ${{ secrets.CAM_KEY }}
          TZ: America/Argentina/Buenos_Aires
        run: python cloud/cam_fetch.py

      - name: Publish
        env:
          TZ: America/Argentina/Buenos_Aires
        run: |
          git config user.name  "planta-solar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in nube data; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then echo "Nothing to publish"; exit 0; fi
          git commit -m "Datos $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs --quiet && git push --quiet && exit 0; sleep 5; done
          git rebase --abort 2>/dev/null || true
          exit 1
