<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Planta Solar en Vivo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F39C12'/%3E%3Cg stroke='%23F39C12' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M6 26l3-3M23 9l3-3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f4f3ef; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#7a7974;
  --rule:#e4e2dc; --grid:#ecebe6; --axis:#b9b7b0;
  --solar:#F39C12; --onsite:#2ECC71; --grid-in:#E74C3C; --inject:#2980B9;
  --warn-bg:#fff4e0; --warn-ink:#7a4a00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --card:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e86;
    --rule:#2c2c2a; --grid:#262624; --axis:#4a4945;
    --solar:#F5A623; --onsite:#34D17A; --grid-in:#EE5A4C; --inject:#3D93CC;
    --warn-bg:#3a2a0c; --warn-ink:#ffd58a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --card:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e86;
  --rule:#2c2c2a; --grid:#262624; --axis:#4a4945;
  --solar:#F5A623; --onsite:#34D17A; --grid-in:#EE5A4C; --inject:#3D93CC;
  --warn-bg:#3a2a0c; --warn-ink:#ffd58a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
header h1{font-size:20px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:14px}
.sub b{color:var(--ink);font-weight:600}
.stale{display:none;margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);
  color:var(--warn-ink);font-size:14px;gap:8px;align-items:flex-start}
.stale.on{display:flex}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px}
.tile .k{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .v{font-size:22px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:3px}
.tile .d{font-size:12px;color:var(--ink3);margin-top:2px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 12px 10px;margin:12px 0}
.card h2{font-size:15px;margin:0 2px 2px}
.card .note{font-size:12px;color:var(--ink2);margin:0 2px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin:2px 2px 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:14px;height:3px;border-radius:2px;background:var(--solar)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--rule);
  border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);
  white-space:nowrap;display:none;z-index:2;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:3px}
.tip div{display:flex;align-items:center;gap:6px}
.tip div span:last-child{margin-left:auto;padding-left:12px}
.cam{margin:12px 0}
.cam .msg2{padding:30px 8px;text-align:center;color:var(--ink2);font-size:13px}
.cam .row a{color:var(--ink2)}
.cam button.open{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.cam button.open:hover,.cam a.open:hover{border-color:var(--axis)}
.cam a.open{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;box-sizing:border-box;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);font-weight:600;text-decoration:none}
.cam a.open:focus-visible{outline:2px solid var(--inject);outline-offset:2px}
.cam button.open:focus-visible,.cam button.close:focus-visible{outline:2px solid var(--inject);outline-offset:2px}
.cam button.open[disabled]{cursor:default;color:var(--ink3);font-weight:500}
.cam .play{width:26px;height:26px;border-radius:50%;background:var(--grid-in);color:#fff;display:grid;place-items:center;
  font-size:11px;flex:none}
.cam button[disabled] .play{background:var(--axis)}
.cam .sub2{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink2)}
.cam .box{margin-top:8px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px}
.cam .ratio{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:8px;overflow:hidden}
.cam iframe,.cam img{position:absolute;inset:0;width:100%;height:100%;border:0}
.cam img{object-fit:contain}
.cam .msg{position:absolute;inset:0;display:grid;place-items:center;color:#ccc;font-size:13px;padding:12px;text-align:center}
.cam .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink2)}
.cam button.close{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 2px}
.hd h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13px;padding:5px 11px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--inject);outline-offset:1px}
.seg button[disabled]{opacity:.45;cursor:default}
.days{margin:10px 2px 4px}
.days table{font-size:12px}
.days td.today{font-weight:600}
details{margin:12px 0}
summary{cursor:pointer;color:var(--ink2);font-size:14px;padding:6px 2px}
/* hourly table: closed state looks like the camera button */
details.tblbox>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);font-weight:600;font-size:inherit}
details.tblbox>summary::-webkit-details-marker{display:none}
details.tblbox>summary:hover{border-color:var(--axis)}
details.tblbox>summary:focus-visible{outline:2px solid var(--inject);outline-offset:2px}
details.tblbox .play{width:26px;height:26px;border-radius:50%;background:var(--inject);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
details.tblbox .sub2{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink2)}
details.tblbox .box{margin-top:8px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink);font-weight:700;font-size:12px}
thead th{border-bottom:2px solid var(--ink)}
tfoot td{font-weight:650}
footer{color:var(--ink3);font-size:12px;margin-top:18px;line-height:1.5}
.daynav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0}
.daynav input[type=date]{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--rule);border-radius:9px;
  background:var(--card);color:var(--ink)}
.daynav .btn{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--card);
  color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.daynav .btn:hover{border-color:var(--axis)}
.daynav .btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.daynav .btn:focus-visible,.daynav input:focus-visible{outline:2px solid var(--inject);outline-offset:1px}
.daynav .lbl{font-size:13px;color:var(--ink2)}
.daynav .print{margin-left:auto}
.daynav [hidden]{display:none !important}
.daynav .msg3{flex-basis:100%;font-size:12px;color:var(--warn-ink)}
@media print{
  @page{size:A4 portrait;margin:11mm}
  html,body{background:#fff !important;font-size:12px}
  html,body{min-height:0 !important}
  main{max-width:none;padding:0}
  .daynav,.seg,#cam,.stale,.tip,details.tblbox>summary{display:none !important}
  header h1{font-size:17px}
  .card{border-color:#ccc;padding:6px 8px 2px;margin:6px 0;break-inside:avoid}
  .card .note{display:none}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:6px;margin:8px 0;break-inside:avoid}
  .tile{padding:6px 8px;border-color:#ccc}
  .tile .v{font-size:16px;margin-top:1px}
  details.tblbox{margin:6px 0}
  details.tblbox .box{border:0;padding:0;margin:0}
  table{font-size:10px}
  th,td{padding:1px 4px}
  footer{margin-top:4px;font-size:9px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ---- irrigation pivots ---- */
:root{--piv:#5B5FC7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--piv:#8C8FF2}}
:root[data-theme="dark"]{--piv:#8C8FF2}
details.tblbox.opbox .play{background:var(--piv)}
details.tblbox.opbox .box{padding:10px 8px}
.pivhd{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center;margin:2px 2px 8px 2px;font-size:13px;color:var(--ink2)}
.pivhd b{color:var(--ink);font-weight:600}
.pivkey{font-size:11px;color:var(--ink3)}
.pivkey i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:4px;background:var(--piv)}
.pivbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pbtn{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.pbtn:hover{border-color:var(--axis)}
.pbtn.pri{background:var(--piv);border-color:var(--piv);color:#fff}
.pbtn[disabled]{opacity:.6;cursor:default}
.pivhd input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);width:150px}
.pivmsg,.pivsum{font-size:12px;color:var(--ink2);margin:8px 2px 0 2px}
.pivmsg{color:var(--ink)}
.pivmsg.ok{color:var(--onsite)}
.pivmsg.err{color:var(--grid-in)}
.tip div.th{margin-bottom:2px}
.tip .pe{font-weight:600;color:var(--ink2);font-size:.95em}
.tip b{display:inline;margin:0}
.tip div.th b{display:block;margin-bottom:3px}
.tip div span.v{margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}
.tip div span.pc{margin-left:0;padding-left:0;width:42px;text-align:right;color:var(--ink3);font-variant-numeric:tabular-nums}
.tip div.tsub span.nm{padding-left:8px}
.tip div.dv{border-top:1px dashed var(--ink3);margin:5px 0 4px;height:0}
@media print{.pivbtns,.pivmsg{display:none !important}}
.tip div.pk{color:#9A6B00;font-weight:600;font-size:.92em;margin:1px 0 3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip div.pk{color:#F0C04A}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Planta solar &middot; energía en vivo</h1>
    <div class="sub" id="sub"></div>
    <div class="stale" id="stale" role="status"><span aria-hidden="true">&#9888;</span><span id="staleText"></span></div>
    <nav class="daynav" id="daynav" aria-label="Elegir día">
      <a class="btn" id="dPrev" href="#" aria-label="Día anterior">&#9664;</a>
      <label class="lbl" for="dPick">Ver día</label>
      <input type="date" id="dPick">
      <a class="btn" id="dNext" href="#" aria-label="Día siguiente">&#9654;</a>
      <a class="btn" id="dToday" href="#">Hoy en vivo</a>
      <button class="btn print" id="dPrint" type="button">&#128438; Imprimir / PDF</button>
      <a class="btn xls" id="dXls" href="#" download hidden>&#11015; Excel del mes</a>
      <span class="msg3" id="dMsg" hidden></span>
    </nav>
  </header>

  <section class="card">
    <div class="hd">
      <h2>SMEC · potencia cada 15 minutos</h2>
      <div class="seg" role="group" aria-label="Período del gráfico">
        <button type="button" id="segDay" aria-pressed="true">Hoy</button>
        <button type="button" id="seg5" aria-pressed="false">5 días</button>
      </div>
    </div>
    <p class="note" id="n15"></p>
    <div class="legend" id="legend1"></div>
    <div class="chart" id="c15"></div>
    <div class="days" id="days5" hidden></div>
  </section>

  <details class="tblbox opbox" id="opBox">
    <summary><span class="play" aria-hidden="true">&#9881;</span><span>Detalle operativo pivotes</span><span class="sub2" id="opSub"></span></summary>
    <div class="box"><div class="piv" id="piv"></div></div>
  </details>

  <section class="cam" id="cam" aria-label="Cámara de la planta">
    <button class="open" id="camBtn" type="button" aria-expanded="false" aria-controls="camBox">
      <span class="play" aria-hidden="true">&#9654;</span>
      <span id="camLabel">Ver cámara en vivo</span>
      <span class="sub2" id="camSub">Planta Agritur</span>
    </button>
    <div class="box" id="camBox" hidden>
      <div class="ratio" id="camRatio"></div>
      <div class="row"><span id="camNote">Video en vivo vía YouTube (sin sonido).</span>
        <button class="close" id="camClose" type="button">&#10005; Cerrar</button></div>
    </div>
  </section>


  <section class="tiles" id="tiles" aria-label="Hoy hasta ahora"></section>


  <details class="tblbox" id="tblBox">
    <summary><span class="play" aria-hidden="true">&#9776;</span><span id="tblLabel">Ver tabla por hora</span><span class="sub2" id="tblSub">kWh por hora</span></summary>
    <div class="box"><table id="tbl"></table></div>
  </details>

  <footer id="foot"></footer>
</main>

// ---- derive series (null = no reading yet) ----
const N = 96, n = D.n, ns = (D.ns==null ? n : D.ns);   // ns: intervals that also have solar data
const q = {sol:[],inj:[],grd:[],onsite:[]};
for (let i=0;i<N;i++){
  const g = i<n ? D.grd[i] : null, j = i<n ? D.inj[i] : null, s = i<ns ? D.sol[i] : null;
  q.grd.push(g); q.inj.push(j); q.sol.push(s); q.onsite.push(s==null ? null : Math.max(0, s-j));
}
const H = {sol:[],inj:[],grd:[],onsite:[]};
const nh = Math.floor(n/4), nhs = Math.floor(ns/4);
for (let h=0;h<24;h++) for (const k in H){
  const ok = (k==='sol'||k==='onsite') ? h<nhs : h<nh;
  H[k].push(ok ? q[k].slice(h*4,h*4+4).reduce((a,b)=>a+b,0) : null);
}
const sum = a => a.reduce((t,x)=>t+(x||0),0);
const T = {sol:sum(q.sol), inj:sum(q.inj), grd:sum(q.grd), onsite:sum(q.onsite)};
T.use = T.onsite + T.grd;
// same sums but only over the stretch that has both meters (for honest ratios when solar data is behind)
const W = {sol:sum(q.sol.slice(0,ns)), inj:sum(q.inj.slice(0,ns)), grd:sum(q.grd.slice(0,ns)), onsite:sum(q.onsite.slice(0,ns))};
W.use = W.onsite + W.grd;

document.getElementById('sub').innerHTML = dTxt + (D.archive ? ' &middot; <b>día completo</b>' : ' &middot; lecturas hasta las <b>'+D.last+'</b>');
if (D.archive){
  document.querySelector('header h1').textContent = 'Planta solar · informe del día';
  document.title = 'Planta Solar · ' + D.date;
  document.getElementById('segDay').textContent = 'Día';
  document.getElementById('cam').hidden = true;
}

// stale check against Argentina time (UTC-3, no DST)
(function(){
  if (D.snapshot || D.archive) return;
  const nowAR = new Date(Date.now() - 3*3600e3);
  const todayAR = nowAR.toISOString().slice(0,10);
  const minsNow = nowAR.getUTCHours()*60 + nowAR.getUTCMinutes();
  const [lh,lm] = D.last.split(':').map(Number); const minsLast = lh*60+lm;
  let msg = '';
  if (D.date < todayAR) {
    if (minsNow > 7*60+30) msg = 'Se muestra el '+dTxt+'. Todavía no llegaron lecturas de hoy.';
  } else if (minsNow - minsLast > 50) {
    msg = 'Sin lecturas nuevas desde las '+D.last+'. Puede haber un problema de conexión con los medidores; la página se pondrá al día sola.';
  } else if (n - ns >= 2) {
    msg = 'El medidor de la planta solar no responde'+(D.solLast ? ' desde las '+D.solLast : '')+
          '. Se muestran los datos de la red al día; la parte solar se completará sola cuando vuelva la conexión.';
  }
  if (msg){ document.getElementById('staleText').textContent = msg; document.getElementById('stale').classList.add('on'); }
  // which meter is failing, and since when (nube/estado/medidores.json, written by every update run even when the page can't be rebuilt)
  if (msg && D.date >= todayAR) fetch('estado/medidores.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.medidores) return;
    const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
    const when = s => !s ? '?' : (s.slice(0,10) === todayAR ? s.slice(11) : s.slice(8,10)+'/'+s.slice(5,7)+' '+s.slice(11));
    const order = [['DAGSR01P','Medidor de entrada (red)'], ['AGRIM02P','Medidor de la planta solar']];
    const lines = order.filter(([k]) => j.medidores[k]).map(([k, nm]) => { const m = j.medidores[k];
      return m.ok ? '&#10003; <b>'+nm+'</b>: funciona &middot; última lectura '+esc(when(m.ultima))
                  : '&#10007; <b>'+nm+'</b>: sin conexión &middot; última lectura '+esc(when(m.ultima))+(m.intento ? ' &middot; último intento '+esc(when(m.intento)) : '')+(m.error ? ' ('+esc(m.error)+')' : ''); });
    if (!lines.length) return;
    const bad = order.filter(([k]) => j.medidores[k] && !j.medidores[k].ok).map(([, nm]) => nm.toLowerCase());
    const head = bad.length ? 'Sin lecturas nuevas desde las '+D.last+': '+(bad.length === 2 ? 'los dos medidores no responden.' : 'el '+bad[0]+' no responde.')
                            : 'Sin lecturas nuevas desde las '+D.last+'.';
    document.getElementById('staleText').innerHTML = esc(head)+'<br>'+lines.join('<br>')+'<br><small>La página se pondrá al día sola cuando vuelva la conexión.</small>';
  }).catch(() => {});
})();

    return t.toLocaleDateString('es-AR',{weekday:'short',day:'numeric'}).replace('.','')+' · '+hhmm(h*15)+'–'+hhmm(h*15+15); };
  PIV.g = {pl, bw, SW, H, TOP, BOT, rh, sp, cbw: bw, n, on: p => R[p], lab};
  let s = '<svg class="pivsvg" viewBox="0 '+(-TOP)+' '+SW+' '+(H+TOP+BOT)+'" width="100%" style="display:block;touch-action:pan-y" role="img" aria-label="Horarios de los pivotes, últimos 5 días">';
  s += '<defs><pattern id="piv5pk" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="'+pk+'" stroke-width="1.4" stroke-opacity="0.22"/></pattern></defs>';
  for (let p=0;p<PIV.n;p++){ const y0 = p*(rh+sp);
    s += '<text x="'+(pl-6)+'" y="'+(y0+rh/2+3.5)+'" text-anchor="end" font-size="10.5" fill="'+cT+'">P'+(p+1)+'</text>';
    s += '<rect x="'+pl.toFixed(2)+'" y="'+y0+'" width="'+(n*bw).toFixed(2)+'" height="'+rh+'" rx="2" fill="'+cOff+'"/>'; }
  // horario pico 18:00-23:00 of each day, same band as on the chart
  for (let b=0; b<n; b+=96){ const xa = pl + (b+72)*bw, wd = 20*bw;
    s += '<rect x="'+xa.toFixed(2)+'" y="-16" width="'+wd.toFixed(2)+'" height="'+(H-sp+16)+'" fill="'+pk+'" fill-opacity="0.08"/>';
    s += '<rect x="'+xa.toFixed(2)+'" y="-16" width="'+wd.toFixed(2)+'" height="'+(H-sp+16)+'" fill="url(#piv5pk)"/>';
    s += '<rect x="'+xa.toFixed(2)+'" y="'+(H-sp+1)+'" width="'+wd.toFixed(2)+'" height="3" fill="'+pk+'"/>'; }
  // running stretches drawn as one bar each; split where the colour or the "still to come" shading changes
  for (let p=0;p<PIV.n;p++){ const y0 = p*(rh+sp), r = R[p];
    let i = 0;
    while (i < n){
      if (!r[i]){ i++; continue; }
      const k = (peak(i) ? 1 : 0) + (i >= nowSlot ? 2 : 0); let j = i + 1;
      while (j < n && r[j] && ((peak(j) ? 1 : 0) + (j >= nowSlot ? 2 : 0)) === k && j % 96 !== 0) j++;
      s += '<rect x="'+(pl+i*bw).toFixed(2)+'" y="'+y0+'" width="'+Math.max(1, (j-i)*bw).toFixed(2)+'" height="'+rh+'" fill="'+(k & 1 ? pk : cOn)+'"'+(k & 2 ? ' fill-opacity="0.35"' : '')+'/>';
      i = j;
    } }
  for (let d=1; d<nd; d++){ const x = pl + d*96*bw;
    s += '<line x1="'+x.toFixed(2)+'" x2="'+x.toFixed(2)+'" y1="-16" y2="'+(H-sp)+'" stroke="'+col('--axis')+'" stroke-width="1" stroke-dasharray="2 3"/>'; }
  if (!D.archive && nowSlot < n){ const x = pl + nowSlot*bw;
    s += '<line x1="'+x.toFixed(2)+'" x2="'+x.toFixed(2)+'" y1="-4" y2="'+(H-sp)+'" stroke="'+col('--solar')+'" stroke-width="1.5"/>'; }
  days.forEach((d, k) => s += '<text x="'+(pl+(k*96+48)*bw).toFixed(1)+'" y="'+(H+12)+'" font-size="10.5" fill="'+cT+'" text-anchor="middle">'+dname(d.date)+'</text>');
  s += '<line id="pivX" x1="0" x2="0" y1="-4" y2="'+(H-sp)+'" stroke="'+cT+'" stroke-width="1" stroke-dasharray="3 3" visibility="hidden" pointer-events="none"/>';
  s += '<g id="pivT" visibility="hidden" pointer-events="none"><rect x="0" y="'+(-TOP+1)+'" height="17" rx="5" fill="'+col('--ink')+'"/>' +
       '<text x="0" y="'+(-TOP+13.5)+'" font-size="11.5" font-weight="600" fill="'+col('--card')+'" text-anchor="middle"></text></g>';
  s += '</svg>';
  let h = '<div class="pivhd"><span><b>Pivotes de riego · últimos 5 días</b> <span class="pivkey"><i style="background:var(--onsite)"></i>encendido <i style="background:'+pk+';margin-left:8px"></i>encendido en horario pico</span></span></div>' + s;
  // per-day totals; today only counts up to the last reading
  const fh = x => x.toLocaleString('es-AR',{maximumFractionDigits:2});
  let tb = '<table style="margin-top:10px"><thead><tr><th>Día</th><th>Horas-pivote</th><th>kWh estimados</th><th>Horas en pico</th><th>Pivotes</th></tr></thead><tbody>';
  const notes = [];
  days.forEach((d, k) => { let sl = 0, pks = 0, used = 0; const lim = d.today && !D.archive ? Math.max(0, D.n || 0) : 96;
    for (let p=0;p<PIV.n;p++){ let c = 0; for (let i=0;i<lim;i++) if (d.on[p][i]){ c++; if (i >= 72 && i < 92) pks++; } sl += c; if (c) used++; }
    tb += '<tr><td'+(d.today ? ' class="today"' : '')+'>'+dname(d.date)+(d.today && !D.archive ? ' (hasta '+D.last+')' : '')+'</td><td>'+fh(sl/4)+'</td><td>'+fmt(sl/4*PIV.kw,0)+'</td><td>'+fh(pks/4)+'</td><td>'+used+'</td></tr>';
    if (d.carry && d.carry.length && !(d.today && pivDirty())) notes.push(dname(d.date)+': '+d.carry.map(p => 'P'+(p+1)).join(', ')); });
  h += tb + '</tbody></table>';
  if (notes.length) h += '<p class="pivsum">Siguen encendidos desde el día anterior (nadie marcó que se apagaron) &mdash; '+notes.join(' &middot; ')+'.</p>';
  h += '<p class="pivsum">kWh estimados = horas-pivote &times; '+fmt(PIV.kw,0)+' kW por pivote. Los horarios se cargan y corrigen en la vista <b>'+(D.archive ? 'Día' : 'Hoy')+'</b>.</p>';
  el.innerHTML = h;
  const svg = el.querySelector('.pivsvg');
  const move = ev => { const t = ev.touches ? ev.touches[0] : ev, r = svg.getBoundingClientRect(), g = PIV.g;
    const x = (t.clientX - r.left) * g.SW / r.width, y = (t.clientY - r.top) * (g.H + g.TOP + g.BOT) / r.height - g.TOP;
    const i = Math.floor((x - g.pl) / g.bw), p = Math.floor(y / (g.rh + g.sp));
    pivHover(i >= 0 && i < g.n ? i : -1, p >= 0 && p < PIV.n ? p : -1, false); };
  svg.addEventListener('mousemove', move); svg.addEventListener('mouseleave', () => pivHover(-1, -1, false));
  svg.addEventListener('touchstart', move, {passive:true}); svg.addEventListener('touchmove', move, {passive:true});
}
// never wait forever for the save service: give up after 20 s (the caller then checks what actually got saved)
async function pivPost(path, body, ms){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 20000);
  try {
    const r = await fetch(PIV.api + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), signal:ctl.signal});
    let j = {}; try { j = await r.json(); } catch(e) {}
    return {status:r.status, j};
  } finally { clearTimeout(t); }
}
async function pivAction(a){
  PIV.msg = ''; PIV.cls = '';
  if (a === 'edit'){
    if (!PIV.api){ PIV.msg = 'La edición de horarios todavía no está habilitada.'; }
    else { PIV.edit = true; PIV.pend = null; }
  } else if (a === 'cancel'){
    PIV.on = pivFrom(JSON.parse(PIV.saved)); PIV.edit = false; PIV.pend = null;
  } else if (a === 'login'){
    const pw = (document.getElementById('pivPw') || {}).value || '';
    if (!pw){ PIV.msg = 'Escriba la contraseña.'; PIV.cls = 'err'; }
    else { PIV.busy = true; draw();
      try { const r = await pivPost('/check', {password:pw}, 15000);
        if (r.status === 200){ PIV.pw = pw; pivSs('pivpw', pw); }
        else { PIV.msg = r.status === 401 ? 'Contraseña incorrecta.' : 'No se pudo verificar la contraseña ('+r.status+').'; PIV.cls = 'err'; }
      } catch(e){ PIV.msg = 'Sin respuesta del servicio de guardado. Intente de nuevo.'; PIV.cls = 'err'; }
      PIV.busy = false; }
  } else if (a === 'save'){
    PIV.busy = true; PIV.pend = null; draw();
    const on = pivTo(PIV.on);
    try { const r = await pivPost('/pivotes', {date:D.date, on, password:PIV.pw});
      if (r.status === 200){ PIV.saved = JSON.stringify(on); PIV.edit = false; PIV.msg = 'Guardado &#10003;'; PIV.cls = 'ok'; }
      else if (r.status === 401){ PIV.pw = ''; pivSs('pivpw', null); PIV.msg = 'La contraseña no es válida; ingrésela de nuevo y vuelva a Guardar.'; PIV.cls = 'err'; }
      else { PIV.msg = 'No se pudo guardar ('+(r.j.error || r.status)+'). Intente de nuevo.'; PIV.cls = 'err'; }
    } catch(e){
      // no answer (timeout or dropped connection): the save may still have gone through, so read the day back and compare
      let ok = false;
      try { const j = await pivFetch(D.date); ok = !!(j && Array.isArray(j.on) && JSON.stringify(j.on) === JSON.stringify(on)); } catch(e2) {}
      if (ok){ PIV.saved = JSON.stringify(on); PIV.edit = false; PIV.msg = 'Guardado &#10003;'; PIV.cls = 'ok'; }
      else { PIV.msg = 'El servicio de guardado no respondió y los horarios no quedaron guardados. Vuelva a tocar Guardar.'; PIV.cls = 'err'; }
    }
    PIV.busy = false;
  }
  draw();
}
document.getElementById('piv').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-a]'); if (b){ if (!b.disabled) pivAction(b.dataset.a); return; }
  if (!pivCanEdit() || PIV.busy) return;
  const cell = ev.target.closest('rect[data-p]'); if (!cell) return;
  const p = +cell.dataset.p, i = +cell.dataset.i, r = PIV.on[p];
  PIV.msg = ''; PIV.pend = null;
  const start = r[i] && (i === 0 || !r[i-1]), stop = !r[i] && i > 0 && r[i-1];
  if (start){ for (let k=i; k<96 && r[k]; k++) r[k] = false; }              // remove this run
  else if (stop){ for (let k=i; k<96 && !r[k]; k++) r[k] = true; }          // remove the turn-off: keeps running
  else if (r[i]){ for (let k=i; k<96 && r[k]; k++) r[k] = false; }          // turn off here (red block)
  else { for (let k=i; k<96 && !r[k]; k++) r[k] = true; }                   // turn on here: green until turned off
  draw();
});
document.getElementById('opBox').addEventListener('toggle', () => draw());
window.addEventListener('beforeunload', e => { if (pivDirty()){ e.preventDefault(); e.returnValue = ''; } });
(async function pivInit(){
  try { const c = await fetch(PIV_ROOT+'pivotes/config.json?t='+Date.now(), {cache:'no-store'});
    if (c.ok){ const j = await c.json(); if (j.n) PIV.n = Math.max(1, Math.min(20, j.n|0)); if (j.kw) PIV.kw = +j.kw || PIV.kw; if (j.api) PIV.api = String(j.api).replace(/\/+$/,''); } } catch(e) {}
  const j = await pivFetch(D.date);
  PIV.on = pivFrom(j && j.on); PIV.carry = [];
  if (!(j && Array.isArray(j.on) && j.on.length)){
    // nothing saved for this day: pivots still running at the end of the last saved day keep running
    // from 00:00 until someone marks them stopped (looks back up to 7 days)
    let d = D.date;
    for (let k=0; k<7; k++){
      const t = new Date(d+'T12:00:00Z'); t.setUTCDate(t.getUTCDate()-1); d = t.toISOString().slice(0,10);
      const pj = await pivFetch(d);
      if (pj && Array.isArray(pj.on) && pj.on.length){
        pj.on.forEach((sx,p) => { if (p < PIV.n && typeof sx === 'string' && sx[95] === '1'){ PIV.on[p].fill(true); PIV.carry.push(p); } });
        break;
      }
    }
  }
  PIV.saved = JSON.stringify(pivTo(PIV.on)); PIV.pw = pivSs('pivpw'); PIV.loaded = true;
  draw();
})();
async function pivFetch(date){
  let j = null;
  if (PIV.api){ const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
    try { const r = await fetch(PIV.api+'/pivotes?date='+date, {cache:'no-store', signal:ctl.signal}); if (r.ok) j = await r.json(); } catch(e) {}
    clearTimeout(t); }
  if (!j){ try { const r = await fetch(PIV_ROOT+'pivotes/'+date+'.json?t='+Date.now(), {cache:'no-store'}); if (r.ok) j = await r.json(); } catch(e) {} }
  return j;
}
